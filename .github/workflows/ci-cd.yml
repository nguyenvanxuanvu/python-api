name: Python API CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  packages: write

concurrency:
  group: python-api-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      target_env: ${{ steps.target.outputs.target_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set target environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target_env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "target_env=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image metadata
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}

  deploy:
    runs-on: [self-hosted, local-k8s]
    needs: build-test-push
    environment: ${{ needs.build-test-push.outputs.target_env }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Write kubeconfig
        run: |
          if [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
            mkdir -p "$HOME/.kube"
            printf "%s" "${{ secrets.KUBE_CONFIG }}" > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
            echo "Using kubeconfig from repository secret"
          else
            echo "KUBE_CONFIG secret not set; using runner local kubeconfig"
          fi

      - name: Validate cluster access
        run: |
          kubectl version --client
          kubectl get nodes

      - name: Set image and deploy
        env:
          IMAGE: ${{ needs.build-test-push.outputs.image }}
          TARGET_ENV: ${{ needs.build-test-push.outputs.target_env }}
        run: |
          rm -rf /tmp/k8s
          cp -R k8s /tmp/k8s
          cd "/tmp/k8s/overlays/$TARGET_ENV"
          kustomize edit set image APP_IMAGE="$IMAGE"
          kubectl apply -k "/tmp/k8s/overlays/$TARGET_ENV"

      - name: Wait for rollout
        env:
          TARGET_ENV: ${{ needs.build-test-push.outputs.target_env }}
        run: |
          kubectl rollout status deployment/python-api -n "python-api-$TARGET_ENV" --timeout=120s

      - name: Smoke check
        env:
          TARGET_ENV: ${{ needs.build-test-push.outputs.target_env }}
        run: |
          kubectl -n "python-api-$TARGET_ENV" get svc python-api
