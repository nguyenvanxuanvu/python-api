name: Python API CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      rollback_revision:
        description: "Rollback revision number (optional, empty = previous)"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  security-events: write  # required for Trivy SARIF upload

# One pipeline per branch+env at a time; cancel stale runs on the same branch
concurrency:
  group: python-api-${{ github.ref }}-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.12"

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  # Fast static analysis — fails early before spending time on a full build.
  lint:
    if: ${{ github.event_name == 'push' || github.event.inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: |
          pip install --quiet flake8 black isort

      - name: Flake8 lint check
        run: flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Black format check
        run: black --check app tests || true  # warn but don't block

      - name: isort import order check
        run: isort --check-only app tests || true

  # ── 2. Test ───────────────────────────────────────────────────────────────────
  # Unit tests with coverage report uploaded as artifact.
  test:
    if: ${{ github.event_name == 'push' || github.event.inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --quiet -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest --cov=app --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  # ── 3. Build & Push ───────────────────────────────────────────────────────────
  # Builds a multi-arch image (amd64 + arm64) and pushes to GHCR.
  # Uses GitHub Actions cache for Docker layers to speed up rebuilds.
  build-push:
    if: ${{ github.event_name == 'push' || github.event.inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      image: ${{ steps.meta.outputs.image }}
      target_env: ${{ steps.target.outputs.target_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target_env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "target_env=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.image }}
          # Reuse layer cache across runs — speeds up builds significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Security scan ──────────────────────────────────────────────────────────
  # Trivy scans the pushed image for HIGH/CRITICAL CVEs.
  # Fails the pipeline if unfixed vulnerabilities are found.
  scan:
    if: ${{ github.event_name == 'push' || github.event.inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Log in to GHCR (needed to pull image for scan)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.19.0
        with:
          image-ref: ${{ needs.build-push.outputs.image }}
          format: table
          exit-code: 1           # block deploy on HIGH/CRITICAL
          severity: HIGH,CRITICAL
          ignore-unfixed: true   # skip CVEs with no fix yet

  # ── 5. Deploy ─────────────────────────────────────────────────────────────────
  # Copies k8s manifests to EC2, patches the image tag with kustomize,
  # applies to the cluster, and waits for the rollout to complete.
  # Temp files are always cleaned up (even on failure).
  deploy:
    if: ${{ github.event_name == 'push' || github.event.inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    needs: [build-push, scan]
    environment: ${{ needs.build-push.outputs.target_env }}
    timeout-minutes: 20
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
      TARGET_ENV: ${{ needs.build-push.outputs.target_env }}
      IMAGE: ${{ needs.build-push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"  || { echo "[ERROR] Missing EC2_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS"  || { echo "[ERROR] Missing EC2_SSH_KNOWN_HOSTS"; exit 1; }
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf "%s\n" "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf "%s\n" "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/id_ed25519"

      - name: Validate EC2 connectivity
        run: |
          SSH_PORT="${EC2_SSH_PORT:-22}"
          echo "Target: $EC2_USER@$EC2_HOST:$SSH_PORT"
          ssh -p "$SSH_PORT" "$EC2_USER@$EC2_HOST" "echo '[REMOTE] ssh-ok; hostname; whoami'"

      - name: Copy k8s manifests to EC2
        run: |
          SSH_PORT="${EC2_SSH_PORT:-22}"
          TMP_DIR="/tmp/python-api-${{ github.run_id }}-${TARGET_ENV}"
          echo "TMP_DIR=$TMP_DIR" >> "$GITHUB_ENV"
          ssh -p "$SSH_PORT" "$EC2_USER@$EC2_HOST" "mkdir -p '$TMP_DIR'"
          scp -P "$SSH_PORT" -r k8s "$EC2_USER@$EC2_HOST:$TMP_DIR/"

      - name: Apply manifests on EC2
        run: |
          SSH_PORT="${EC2_SSH_PORT:-22}"
          ssh -p "$SSH_PORT" "$EC2_USER@$EC2_HOST" \
            "IMAGE='$IMAGE' TARGET_ENV='$TARGET_ENV' TMP_DIR='$TMP_DIR' bash -s" <<'REMOTE'
          set -euxo pipefail
          command -v kubectl   >/dev/null || { echo "kubectl not found on EC2";   exit 1; }
          command -v kustomize >/dev/null || { echo "kustomize not found on EC2"; exit 1; }
          kubectl version --client && kustomize version
          kubectl get nodes >/dev/null

          cd "$TMP_DIR/k8s/overlays/$TARGET_ENV"
          kustomize edit set image APP_IMAGE="$IMAGE"
          kubectl apply -k .
          REMOTE

      - name: Wait for rollout
        run: |
          SSH_PORT="${EC2_SSH_PORT:-22}"
          ssh -p "$SSH_PORT" "$EC2_USER@$EC2_HOST" \
            "TARGET_ENV='$TARGET_ENV' bash -s" <<'REMOTE'
          set -euo pipefail
          NAMESPACE="python-api-$TARGET_ENV"
          kubectl rollout status deployment/python-api -n "$NAMESPACE" --timeout=120s
          kubectl -n "$NAMESPACE" get pods,svc
          REMOTE

      - name: Cleanup remote temp dir
        if: always()   # run even if a previous step failed
        run: |
          SSH_PORT="${EC2_SSH_PORT:-22}"
          ssh -p "$SSH_PORT" "$EC2_USER@$EC2_HOST" "rm -rf '$TMP_DIR'" || true


  # ── 6. Rollback ───────────────────────────────────────────────────────────────
  # Manual only — triggered via workflow_dispatch with action=rollback.
  # Shows history before and after so the operator can confirm the state.
  rollback:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    timeout-minutes: 20
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
      TARGET_ENV: ${{ github.event.inputs.environment }}
      ROLLBACK_REVISION: ${{ github.event.inputs.rollback_revision }}
    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"  || { echo "[ERROR] Missing EC2_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS"  || { echo "[ERROR] Missing EC2_SSH_KNOWN_HOSTS"; exit 1; }
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf "%s\n" "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf "%s\n" "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Show rollout history (before)
        run: |
          SSH_PORT="${EC2_SSH_PORT:-22}"
          ssh -p "$SSH_PORT" "$EC2_USER@$EC2_HOST" \
            "kubectl -n 'python-api-$TARGET_ENV' rollout history deployment/python-api"

      - name: Execute rollback
        run: |
          SSH_PORT="${EC2_SSH_PORT:-22}"
          ssh -p "$SSH_PORT" "$EC2_USER@$EC2_HOST" \
            "TARGET_ENV='$TARGET_ENV' ROLLBACK_REVISION='$ROLLBACK_REVISION' bash -s" <<'REMOTE'
          set -euxo pipefail
          NAMESPACE="python-api-$TARGET_ENV"
          command -v kubectl >/dev/null || { echo "kubectl not found"; exit 1; }

          if [ -n "${ROLLBACK_REVISION:-}" ]; then
            echo "[REMOTE] Rolling back to revision $ROLLBACK_REVISION"
            kubectl -n "$NAMESPACE" rollout undo deployment/python-api --to-revision="$ROLLBACK_REVISION"
          else
            echo "[REMOTE] Rolling back to previous revision"
            kubectl -n "$NAMESPACE" rollout undo deployment/python-api
          fi

          kubectl -n "$NAMESPACE" rollout status deployment/python-api --timeout=120s
          REMOTE

      - name: Show rollout history (after)
        run: |
          SSH_PORT="${EC2_SSH_PORT:-22}"
          ssh -p "$SSH_PORT" "$EC2_USER@$EC2_HOST" bash -s <<REMOTE
          kubectl -n "python-api-$TARGET_ENV" rollout history deployment/python-api
          kubectl -n "python-api-$TARGET_ENV" get pods,svc
          REMOTE
